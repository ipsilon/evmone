version: 2.1

commands:
  bench:
    steps:
      - checkout
      - run:
          name: "Build and run the Keccak benchmark"
          command: |
            for cxx in clang++ g++; do
              command -v $cxx >/dev/null || continue
              echo "### $cxx: $($cxx --version | head -1)"
              grep -m1 -E "model name|Hardware" /proc/cpuinfo 2>/dev/null; lscpu 2>/dev/null | grep -E "Model name|Vendor"; $cxx -std=c++20 -O3 bench_keccak_arm.cpp -o bench_$cxx && ./bench_$cxx 2000000 9
            done

jobs:
  macos-m4pro:
    resource_class: m4pro.medium
    macos:
      xcode: 26.5
    steps:
      - bench
  linux-arm:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - bench

workflows:
  keccak-arm-bench:
    jobs:
      - macos-m4pro
      - linux-arm
