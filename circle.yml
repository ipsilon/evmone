version: 2.1

jobs:
  macos:
    parameters:
      rc: {type: string}
      xcode: {type: string}
    resource_class: << parameters.rc >>
    macos:
      xcode: << parameters.xcode >>
    steps:
      - checkout
      - run: kbench/run.sh
  linux-arm:
    parameters:
      rc: {type: string}
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.rc >>
    steps:
      - checkout
      - run: kbench/run.sh

workflows:
  keccak-arm-bench:
    jobs:
      - macos:
          matrix:
            parameters:
              rc: [m4pro.medium, m4pro.large]
              xcode: ["26.5"]
      - macos:
          name: macos-m2pro
          rc: m2pro.medium
          xcode: "16.4.0"
      - linux-arm:
          matrix:
            parameters:
              rc: [arm.medium, arm.large, arm.xlarge, arm.2xlarge]
