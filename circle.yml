# Throwaway: probes the CPU features of the CircleCI machines.
version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  probe-linux:
    parameters:
      rc:
        type: string
    docker:
      - image: chfast/cpp-build-env:25-gcc-15
    resource_class: << parameters.rc >>
    parallelism: 6
    steps:
      - checkout
      - run:
          name: "Probe"
          command: |
            echo "KERNEL $(grep -m1 'model name' /proc/cpuinfo) | $(for f in avx2 bmi2 adx; do grep -qw $f /proc/cpuinfo && printf '%s=1 ' $f || printf '%s=0 ' $f; done)"
            g++ -O1 -o cpuprobe ci-cpu-probe/cpuprobe.cpp && ./cpuprobe

  probe-windows:
    executor: win/server-2022
    parallelism: 3
    steps:
      - checkout
      - run:
          name: "Probe"
          shell: powershell
          command: |
            $ErrorActionPreference = "Stop"
            & 'C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1' -Arch amd64 -SkipAutomaticLocation
            cl /nologo /O1 /EHsc ci-cpu-probe\cpuprobe.cpp
            .\cpuprobe.exe

  probe-machine:
    parameters:
      rc:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.rc >>
    parallelism: 6
    steps:
      - checkout
      - run:
          name: "Probe"
          command: |
            echo "KERNEL $(grep -m1 'model name' /proc/cpuinfo) | $(for f in avx2 bmi2 adx; do grep -qw $f /proc/cpuinfo && printf '%s=1 ' $f || printf '%s=0 ' $f; done)"
            g++ -O1 -o cpuprobe ci-cpu-probe/cpuprobe.cpp && ./cpuprobe

workflows:
  probe:
    jobs:
      # The docker and Windows probes ran in the previous commit.
      - probe-machine:
          matrix:
            parameters:
              rc: [medium, large, xlarge, 2xlarge]
