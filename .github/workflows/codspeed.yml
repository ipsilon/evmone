name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

env:
  BUILD_DIR: build
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  # The default GCC on the ubuntu-26.04 image, where GCC 16 is only a pre-release snapshot.
  CC: gcc-15
  CXX: g++-15
  # A benchmark is identified by the name of the fixture it ran, so a release which renames
  # the fixtures starts the series over. Bump this deliberately, with the archive's digest.
  BENCHMARK_FIXTURES_RELEASE: tests-benchmark@v0.0.11
  BENCHMARK_FIXTURES_SHA256: 7ed826b7e6fe9bbf66c027b417cde359ae50fcb3519728c85c1ee9f22c9c2807
  FIXTURES: fixtures/blockchain_tests/for_amsterdam_at_0001M

jobs:
  benchmark:
    name: Benchmark ${{ matrix.name }}
    # Pin OS version for compatibility with CodSpeed's instrumented Valgrind.
    runs-on: ubuntu-26.04
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    strategy:
      fail-fast: false
      # CodSpeed merges the jobs of a workflow run into one report. Sweeps measured elsewhere are
      # left out: modexp.json (the precompiles benchmark sweeps it), log_benchmark.json (log.json
      # sweeps the same opcodes), and calldatacopy_from_origin.json and returndatacopy.json
      # (mcopy.json sweeps the same copying).
      matrix:
        include:
          - name: evmone
            # The precompiles benchmark runs both the mainnet inputs and the modexp parameter sweep:
            # the mainnet moduli are all odd and 256-bit, so they cover one code path and hide the
            # work on the others.
            run: >-
              $BUILD_DIR/bin/evmone-bench test/evm-benchmarks/benchmarks --benchmark_filter='baseline/(analyse|execute)' &&
              $BUILD_DIR/bin/evmone-precompiles-bench
          # The worst-case blocks of the execution spec tests, run as the tests they are: each
          # checks its post state and is measured on the way. Every one is filled for seven block
          # sizes and the smallest is taken, covering all in a fraction of the simulator time.
          - name: instruction
            fixtures: compute/instruction
            run: >-
              $BUILD_DIR/bin/evmone test $FIXTURES/compute/instruction
              --ignore call_context --ignore account_query --ignore log/log_benchmark.json
          - name: instruction/call_context
            fixtures: compute/instruction/call_context
            run: >-
              $BUILD_DIR/bin/evmone test $FIXTURES/compute/instruction/call_context
              --ignore calldatacopy_from_origin.json --ignore returndatacopy.json
          - name: instruction/account_query
            fixtures: compute/instruction/account_query
            run: $BUILD_DIR/bin/evmone test $FIXTURES/compute/instruction/account_query
          - name: precompile
            fixtures: compute/precompile
            run: $BUILD_DIR/bin/evmone test $FIXTURES/compute/precompile --ignore modexp/modexp.json
          - name: scenario
            fixtures: compute/scenario compute/eip7928_block_level_access_lists
            run: >-
              $BUILD_DIR/bin/evmone test $FIXTURES/compute/scenario
              $FIXTURES/compute/eip7928_block_level_access_lists
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install GMP
        run: sudo apt-get -q update && sudo apt-get -qy install libgmp-dev

      - name: Configure
        # The Release build type keeps the -O3 optimizations on, -g adds the debug information
        # needed by CodSpeed to attribute the measurements to the source code. CodSpeed recommends
        # (and warns about) RelWithDebInfo, but that would downgrade the optimizations to -O2.
        run: >
          cmake -S . -B $BUILD_DIR
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-g
          -DCMAKE_CXX_FLAGS=-g
          -DBUILD_SHARED_LIBS=OFF
          -DEVMONE_TESTING=ON
          -DEVMONE_PRECOMPILES_GMP=ON
          -DEVMONE_PRECOMPILES_LIBSECP256K1=ON
          -DCODSPEED_MODE=simulation

      - name: Build
        run: cmake --build $BUILD_DIR --target evmone-bench evmone-precompiles-bench evmone-cli

      # Only the job's own fixtures are unpacked.
      - name: Download the benchmark fixtures
        if: matrix.fixtures
        run: |
          curl -L --fail --retry 3 --output-dir /tmp -O \
            https://github.com/ethereum/execution-specs/releases/download/$BENCHMARK_FIXTURES_RELEASE/fixtures_benchmark.tar.gz
          echo "$BENCHMARK_FIXTURES_SHA256  /tmp/fixtures_benchmark.tar.gz" | sha256sum -c
          tar -xzf /tmp/fixtures_benchmark.tar.gz $(printf "$FIXTURES/%s " ${{ matrix.fixtures }})

      - name: Benchmark
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: ${{ matrix.run }}
