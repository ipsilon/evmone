name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

env:
  BUILD_DIR: build
  # A benchmark is identified by the name of the fixture it ran, so a release which renames
  # the fixtures starts the series over. Bump this deliberately, with the archive's digest.
  BENCHMARK_FIXTURES_RELEASE: benchmark@v0.0.7
  BENCHMARK_FIXTURES_SHA256: efa7cbec58bedab28870e260eca1f5271b1c3d81c952f221ba6432bff88fee5d
  FIXTURES: fixtures/blockchain_tests/benchmark

jobs:
  benchmark:
    name: Benchmark ${{ matrix.suite.name }} (${{ matrix.mode }})
    # The simulation counts the instructions, so it misses what only shows in the time: the
    # cache and branch prediction effects. The walltime measures that on CodSpeed's bare-metal
    # runners, the arm64 ones, whose minutes are free.
    # CodSpeed ships its instrumented Valgrind for Ubuntu 22.04, Ubuntu 24.04 and Debian 12 only,
    # and bails out with "Unsupported system" anywhere else, so the image cannot be `latest`.
    runs-on: ${{ matrix.mode == 'walltime' && 'codspeed-macro-arm64-graviton-ubuntu-22-04' || 'ubuntu-24.04' }}
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    env:
      # The newest GCC of the image, which otherwise defaults to an older one.
      CC: ${{ matrix.mode == 'walltime' && 'gcc-12' || 'gcc-14' }}
      CXX: ${{ matrix.mode == 'walltime' && 'g++-12' || 'g++-14' }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.mode == 'walltime' && 16 || 4 }}
    strategy:
      fail-fast: false
      # CodSpeed merges the jobs of a workflow run into one report, but rejects too many
      # benchmarks in a single upload (750 were), so the fixtures are split into jobs. Two sweeps
      # measured elsewhere are left out: modexp.json (the precompiles benchmark sweeps it) and
      # log_benchmark.json (log.json sweeps the same opcodes).
      matrix:
        mode: [simulation, walltime]
        suite:
          - name: evmone
            # The precompiles benchmark runs both the mainnet inputs and the modexp parameter sweep:
            # the mainnet moduli are all odd and 256-bit, so they cover one code path and hide the
            # work on the others.
            run: >-
              $BUILD_DIR/bin/evmone-bench test/evm-benchmarks/benchmarks --benchmark_filter='baseline/(analyse|execute)' &&
              $BUILD_DIR/bin/evmone-precompiles-bench
          # The worst-case blocks of the execution spec tests, run as the tests they are: each
          # checks its post state and is measured on the way. Every one is filled for seven block
          # sizes and the smallest is taken, covering all in a fraction of the simulator time.
          - name: instruction
            fixtures: compute/instruction
            run: >-
              $BUILD_DIR/bin/evmone test $FIXTURES/compute/instruction -k benchmark-gas-value_1M
              --ignore call_context --ignore account_query --ignore log/log_benchmark.json
          - name: instruction/call_context
            fixtures: compute/instruction/call_context
            run: $BUILD_DIR/bin/evmone test $FIXTURES/compute/instruction/call_context -k benchmark-gas-value_1M
          - name: instruction/account_query
            fixtures: compute/instruction/account_query
            run: $BUILD_DIR/bin/evmone test $FIXTURES/compute/instruction/account_query -k benchmark-gas-value_1M
          - name: precompile
            fixtures: compute/precompile
            run: $BUILD_DIR/bin/evmone test $FIXTURES/compute/precompile -k benchmark-gas-value_1M --ignore modexp/modexp.json
          - name: scenario
            fixtures: compute/scenario
            run: $BUILD_DIR/bin/evmone test $FIXTURES/compute/scenario -k benchmark-gas-value_1M
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install GMP
        run: sudo apt-get -q update && sudo apt-get -qy install libgmp-dev

      # Ubuntu 22.04 ships CMake 3.22, older than the required 3.25, and GCC 11.
      - name: Install CMake and GCC
        if: matrix.mode == 'walltime'
        run: |
          curl -L --fail --retry 3 https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-linux-aarch64.tar.gz | sudo tar -xz --strip=1 -C /usr/local
          sudo apt-get -qy install g++-12

      - name: Configure
        # The Release build type keeps the -O3 optimizations on, -g adds the debug information
        # needed by CodSpeed to attribute the measurements to the source code. CodSpeed recommends
        # (and warns about) RelWithDebInfo, but that would downgrade the optimizations to -O2.
        run: >
          cmake -S . -B $BUILD_DIR
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-g
          -DCMAKE_CXX_FLAGS=-g
          -DBUILD_SHARED_LIBS=OFF
          -DEVMONE_TESTING=ON
          -DEVMONE_PRECOMPILES_GMP=ON
          -DEVMONE_PRECOMPILES_LIBSECP256K1=ON
          -DCODSPEED_MODE=${{ matrix.mode }}

      - name: Build
        run: cmake --build $BUILD_DIR --target evmone-bench evmone-precompiles-bench evmone-cli

      # Only the job's own fixtures are unpacked.
      - name: Download the benchmark fixtures
        if: matrix.suite.fixtures
        run: |
          curl -L --fail --retry 3 --output-dir /tmp -O \
            https://github.com/ethereum/execution-spec-tests/releases/download/$BENCHMARK_FIXTURES_RELEASE/fixtures_benchmark.tar.gz
          echo "$BENCHMARK_FIXTURES_SHA256  /tmp/fixtures_benchmark.tar.gz" | sha256sum -c
          tar -xzf /tmp/fixtures_benchmark.tar.gz $FIXTURES/${{ matrix.suite.fixtures }}

      - name: Benchmark
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ matrix.mode }}
          run: ${{ matrix.suite.run }}
