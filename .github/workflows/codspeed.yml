name: CodSpeed

on:
  push:
    branches:
      - master
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

env:
  BUILD_DIR: build
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        # RelWithDebInfo keeps the optimizations on and adds the debug information
        # needed by CodSpeed to attribute the measurements to the source code.
        run: >
          cmake -S . -B $BUILD_DIR
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_SHARED_LIBS=OFF
          -DEVMONE_TESTING=ON
          -DCODSPEED_MODE=simulation

      - name: Build
        run: cmake --build $BUILD_DIR --target evmone-bench evmone-precompiles-bench

      # CodSpeed aggregates the results of all the runs of a single workflow run.
      - name: Benchmark the baseline VM
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: ${{ env.BUILD_DIR }}/bin/evmone-bench test/evm-benchmarks/benchmarks --benchmark_filter='baseline/(analyse|execute)'

      - name: Benchmark the precompiles
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # The file part of the URI contains "precompile" as well, hence the "::".
          run: ${{ env.BUILD_DIR }}/bin/evmone-precompiles-bench --benchmark_filter=::precompile
