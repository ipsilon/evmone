name: Keccak ARM benchmark

on:
  push:
    branches:
      - ci/keccak-arm-bench

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the Keccak benchmark
        run: |
          for cxx in clang++ g++; do
            command -v $cxx >/dev/null || continue
            echo "### $cxx: $($cxx --version | head -1)"
            (lscpu 2>/dev/null | grep -E "Model name|Vendor") || true; $cxx -std=c++20 -O3 bench_keccak_arm.cpp -o bench_$cxx && ./bench_$cxx 2000000 9
          done
