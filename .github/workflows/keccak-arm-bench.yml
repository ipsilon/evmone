name: Keccak ARM benchmark

on:
  push:
    branches:
      - ci/keccak-arm-bench

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, ubuntu-24.04-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: kbench/run.sh
