name: RISC-V probe

on:
  push:
    branches:
      - ci/riscv64-probe

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-13, clang++-18, clang++-19, clang++-20]
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install
        run: |
          cc=$(echo ${{ matrix.cxx }} | sed 's/^clang++/clang/; s/^g++/gcc/')
          pkg=$(echo ${{ matrix.cxx }} | sed 's/clang++/clang/')
          command -v ${{ matrix.cxx }} || (sudo apt-get update -q && sudo apt-get install -y -q $pkg)
          echo "CC=$cc" >> $GITHUB_ENV; echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          ${{ matrix.cxx }} --version | head -1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEVMONE_TESTING=ON
      - name: Build
        run: time cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel $(nproc)
