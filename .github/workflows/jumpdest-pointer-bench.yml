name: JUMPDEST pointer benchmark

on:
  push:
    branches:
      - bench/jumpdest-pointer

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }} ${{ matrix.tag }} ${{ matrix.n }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The x86 runners get one of several CPUs, so their jobs are repeated.
        # The image jobs build with GCC 15 and Clang 21 in docker; the others use the runner's compiler.
        include:
          - {os: ubuntu-24.04-arm, tag: gcc-13, cc: gcc, n: 1}
          - {os: ubuntu-24.04-arm, tag: clang-18, cc: clang, n: 1}
          - {os: macos-15, tag: clang, cc: clang, n: 1}
          - {os: ubuntu-24.04, tag: gcc-13, cc: gcc, n: 1}
          - {os: ubuntu-24.04, tag: gcc-13, cc: gcc, n: 2}
          - {os: ubuntu-24.04, tag: gcc-13, cc: gcc, n: 3}
          - {os: ubuntu-24.04, tag: clang-18, cc: clang, n: 1}
          - {os: ubuntu-24.04, tag: gcc-15, image: chfast/cpp-build-env:25-gcc-15, n: 1}
          - {os: ubuntu-24.04, tag: gcc-15, image: chfast/cpp-build-env:25-gcc-15, n: 2}
          - {os: ubuntu-24.04, tag: gcc-15, image: chfast/cpp-build-env:25-gcc-15, n: 3}
          - {os: ubuntu-24.04, tag: clang-21, image: chfast/cpp-build-env:25-clang-21, n: 1}
          - {os: ubuntu-24.04, tag: clang-21, image: chfast/cpp-build-env:25-clang-21, n: 2}
          - {os: ubuntu-24.04, tag: clang-21, image: chfast/cpp-build-env:25-clang-21, n: 3}
          - {os: ubuntu-22.04, tag: gcc-11, cc: gcc, n: 1}
          - {os: ubuntu-22.04, tag: gcc-11, cc: gcc, n: 2}
          - {os: macos-15-intel, tag: clang, cc: clang, n: 1}
    env:
      LABEL: github-${{ matrix.os }}-${{ matrix.tag }}-${{ matrix.n }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools (Linux)
        if: runner.os == 'Linux' && !matrix.image
        run: command -v ninja || (sudo apt-get update -q && sudo apt-get install -y -q ninja-build)
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
      - name: Benchmark
        if: '!matrix.image'
        run: |
          if [ "${{ matrix.cc }}" = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          JOBS=4 test/internal_benchmarks/jumpdest_pointer_bench_ci.sh "$LABEL" results
      - name: Benchmark (in docker)
        if: matrix.image
        run: |
          mkdir -p results
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e JOBS=4 \
            -v "$PWD:/src" -w /src ${{ matrix.image }} \
            test/internal_benchmarks/jumpdest_pointer_bench_ci.sh "$LABEL" results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jdp-${{ env.LABEL }}
          path: results

  riscv64:
    # The RISE project runners (4 T-Head C910 cores), set up as in riscv.yml.
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 150
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.hunter/_Base/Cache
          key: hunter-riscv64-${{ hashFiles('cmake/Hunter/*.cmake') }}
      - name: Benchmark
        run: JOBS=4 test/internal_benchmarks/jumpdest_pointer_bench_ci.sh github-riscv64-clang-18 results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jdp-riscv64-clang-18
          path: results
