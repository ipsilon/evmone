name: JUMPDEST analysis NEON

on:
  push:
    branches:
      - bench/jumpdest-neon

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEVMONE_TESTING=ON
          cmake --build build --target evmone-bench-internal -j4
      - name: Benchmark
        run: |
          build/bin/evmone-bench-internal \
            --benchmark_filter='jumpdest_analysis/(real.*|stop|jumpdest|push32|rand_bytes|rand_stop_jumpdest_push1|rand_jumpdest_push1|rand_push1to32)/(default|g8_neon|x_g8_nochain|opus_a_1|fable_a_1|fable_b_1|fable_b_2)/a32' \
            --benchmark_repetitions=5 --benchmark_report_aggregates_only=true --benchmark_min_time=0.2s \
            | tee out.txt
          { echo '```'; grep -E '_median|Benchmark' out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
